[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter api db:generate && pnpm --filter api build"

[deploy]
startCommand = "cd apps/api && npx prisma migrate deploy && npx prisma db seed; cd ../.. && node apps/api/dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
