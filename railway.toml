[build]
builder = "NIXPACKS"
buildCommand = "NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter api db:generate && pnpm --filter api build"

[deploy]
startCommand = "cd apps/api && npx prisma migrate deploy && (npx prisma db seed || true) && cd ../.. && export PUPPETEER_EXECUTABLE_PATH=$(which chromium) && node apps/api/dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
